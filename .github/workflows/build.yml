name: Build SkyBoxyMarket
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper-api: ['26.1.2.build.74-stable', '26.2.build.133-stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean test shadowJar -PpaperTestApiVersion=${{ matrix.paper-api }} --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SkyBoxyMarket-plugin-${{ matrix.paper-api }}
          path: build/libs/*.jar
